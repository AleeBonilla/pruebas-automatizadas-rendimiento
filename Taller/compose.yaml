# Entorno del taller (Taller.md 5). Versiones de 5.1 y límites de 5.2.
#
#   docker compose up -d --build --wait     levanta los servicios y espera a que estén sanos
#   docker compose run --rm api pytest      pruebas funcionales y de concurrencia
#   docker compose down -v                  detiene todo y borra los datos
#
# Restablecer datos y contadores antes de cada repetición, y comprobar el estado:
#   docker compose exec -T postgres psql -U taller -d tienda -f /base-datos/restablecer.sql
#   docker compose exec -T postgres psql -U taller -d tienda -c "SELECT * FROM resumen_datos"
#
# La variante se elige con VARIANTE (regresion, corregida o sana); por defecto, corregida.
# Los servicios gatling y herramientas están en compose.carga.yaml (persona 2).

name: taller-rendimiento

x-postgres-conexion: &postgres-conexion
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: tienda
  PGUSER: taller
  PGPASSWORD: taller

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
    volumes:
      - datos-postgres:/var/lib/postgresql
      - ./base-datos/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      # Semilla y restablecer.sql, que ejecutan los scripts del taller (Taller.md §11).
      - ./base-datos:/base-datos:ro
    healthcheck:
      # Por TCP: durante la inicialización PostgreSQL solo escucha en el socket local,
      # así que el servicio no aparece sano hasta que los datos están cargados.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=taller", "--dbname=tienda"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 60s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  api:
    build: ./api
    image: taller-api:local
    environment:
      <<: *postgres-conexion
      VARIANTE: ${VARIANTE:-corregida}
      HILOS: "8"
      POOL_CONEXIONES: "8"
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observabilidad/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/paneles/api-taller.json
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/paneles:/var/lib/grafana/paneles:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

volumes:
  datos-postgres:
